services:
  app:
    profiles: [container]
    build:
      context: ./app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/ledger.db}
      JWT_SECRET: ${JWT_SECRET:-solo-para-uso-local-no-usar-en-gcp-0123456789}
    volumes:
      - ledger-data:/data

volumes:
  ledger-data:
