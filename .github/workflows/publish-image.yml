# Construye la imagen y la publica en Artifact Registry. Entra con Workload Identity Federation
# usando una identidad que solo puede escribir en el repositorio de imagenes.
name: publish-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publicar imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calcular el nombre de la imagen
        id: name
        env:
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ -z "$REGION" || -z "$PROJECT" ]]; then
            echo "::error::Faltan las variables GCP_REGION y GCP_PROJECT_ID (Parte 5)"
            exit 1
          fi
          echo "registry=$REGION-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$REGION-docker.pkg.dev/$PROJECT/ledger/ledger" >> "$GITHUB_OUTPUT"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.name.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Mostrar el digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Use este digest al ejecutar el workflow **deploy**:"
            echo
            echo '```'
            echo "$DIGEST"
            echo '```'
            echo
            echo "Imagen completa: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
